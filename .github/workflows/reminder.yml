name: Weekly Reminder

on:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: 1
          body: |
            🔔 Weekly check-in! What's the latest progress on Glyphra?
